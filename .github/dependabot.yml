version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/backend/core"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/backend/supporting"
    schedule:
      interval: "weekly"
