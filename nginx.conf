server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /api/depositors {
    proxy_pass http://core:8002;
  }

  location /api/countries {
    proxy_pass http://core:8002;
  }

  location /api/deposits {
    proxy_pass http://core:8002;
  }

  location /api/currencies {
    proxy_pass http://core:8002;
  }

  location /api/contracts {
    proxy_pass http://core:8002;
  }

  location /api/reports {
    proxy_pass http://core:8002;
  }

  location /api/plans {
    proxy_pass http://core:8002;
  }

  location /api/ {
    proxy_pass http://supporting:8001;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ =404;
  }

  error_page 404 = @error404;
  location @error404 { return 302 /pages/error.html?code=404; }

  error_page 500 502 503 504 = @error500;
  location @error500 { return 302 /pages/error.html?code=500; }
}
