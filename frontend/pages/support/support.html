<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DepositOne Support</title>
  <link rel="icon" type="image/png" href="/assets/favicons/favicon.png">
  <link rel="apple-touch-icon" href="/assets/favicons/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/shared/fonts.css">
  <link rel="stylesheet" href="/css/shared/base.css">
  <link rel="stylesheet" href="/css/shared/background.css">
  <link rel="stylesheet" href="/css/shared/layout.css">
  <link rel="stylesheet" href="/css/shared/form.css">
  <link rel="stylesheet" href="/css/support/support.css">
</head>
<body data-layout="page">
  <div class="page">
    <div class="page-scene">
      <section class="page-hero">
        <div class="container">
          <h1 class="page-title">Contact the DepositOne team</h1>
        </div>
      </section>

      <section class="page-section">
        <div class="container">
          <div class="support-section">
            <section class="form-card panel">
              <h2 class="form-card-title">Create Ticket</h2>
              <form class="form-body" id="entityForm" novalidate>
                <p class="form-status" id="formStatus"></p>
                <div class="form-actions">
                  <button class="form-button" type="submit">Send Ticket</button>
                </div>
              </form>
            </section>

            <section class="contact-card panel">
              <h2 class="contact-title">Contact Info</h2>
              <div class="contact-rows">
                <div class="contact-row">
                  <span class="contact-label">Email</span>
                  <span class="contact-value">support@depositone.com</span>
                </div>
                <div class="contact-row">
                  <span class="contact-label">Phone</span>
                  <span class="contact-value">+7(495) 124-04-08</span>
                </div>
              </div>
            </section>
          </div>
        </div>
      </section>
    </div>
  </div>
  <script src="/js/shared/language.js"></script>
  <script src="/js/shared/layout.js"></script>
  <script src="/js/shared/format.js"></script>
  <script src="/js/shared/form.js"></script>
  <script src="/js/support/support.js"></script>
</body>
</html>
