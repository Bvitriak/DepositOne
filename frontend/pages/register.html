<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DepositOne Registration</title>
  <link rel="icon" type="image/png" href="../assets/favicons/favicon.png">
  <link rel="apple-touch-icon" href="../assets/favicons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body>
  <main class="auth">
    <div class="auth-bg">
      <img class="auth-glow auth-glow-sunset" src="../assets/img/glow-sunset.svg" alt="">
      <img class="auth-glow auth-glow-ambient" src="../assets/img/glow-ambient.svg" alt="">
      <div class="stars" id="stars"></div>
      <img class="auth-mtn auth-mtn-far" src="../assets/img/mountains-far.svg" alt="">
      <img class="auth-mtn auth-mtn-mid" src="../assets/img/mountains-mid.svg" alt="">
      <img class="auth-mtn auth-mtn-near" src="../assets/img/mountains-near.svg" alt="">
      <img class="auth-mtn auth-mtn-fore" src="../assets/img/mountains-foreground.svg" alt="">
      <div class="auth-overlay"></div>
    </div>

    <div class="auth-card">
      <a class="auth-logo" href="../index.html" aria-label="DepositOne — home">
        <div class="auth-badge">WE CARE ABOUT YOU<span class="dot"></span></div>
        <div class="auth-name gradient-text">DEPOSITONE</div>
      </a>

      <div class="auth-body">
        <h1 class="auth-title">Registration</h1>
        <form class="auth-form" id="registerForm">
          <div class="auth-fields">
            <input class="auth-field" type="text" name="username" placeholder="Enter Nickname" autocomplete="username" required>
            <input class="auth-field" type="email" name="email" placeholder="Enter Email" autocomplete="email" required>
            <div class="auth-password">
              <input class="auth-field" type="password" name="password" placeholder="Enter Password" autocomplete="new-password" required>
              <button class="auth-eye" type="button" aria-label="Show password">
                <svg class="auth-eye-icon" viewBox="0 0 32 24" preserveAspectRatio="none" fill="none" aria-hidden="true">
                  <path d="M1 12C1 12 6.45455 1 16 1C25.5455 1 31 12 31 12C31 12 25.5455 23 16 23C6.45455 23 1 12 1 12Z" stroke="#F4F7FB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                  <path d="M16 16.125C18.2593 16.125 20.0909 14.2782 20.0909 12C20.0909 9.72183 18.2593 7.875 16 7.875C13.7407 7.875 11.9091 9.72183 11.9091 12C11.9091 14.2782 13.7407 16.125 16 16.125Z" stroke="#F4F7FB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                  <path class="slash" d="M2 2L30 22" stroke="#F4F7FB" stroke-width="2" stroke-linecap="round" pathLength="100"/>
                </svg>
              </button>
            </div>
            <div class="auth-password">
              <input class="auth-field" type="password" name="confirm" placeholder="Confirm Password" autocomplete="new-password" required>
              <button class="auth-eye" type="button" aria-label="Show password">
                <svg class="auth-eye-icon" viewBox="0 0 32 24" preserveAspectRatio="none" fill="none" aria-hidden="true">
                  <path d="M1 12C1 12 6.45455 1 16 1C25.5455 1 31 12 31 12C31 12 25.5455 23 16 23C6.45455 23 1 12 1 12Z" stroke="#F4F7FB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                  <path d="M16 16.125C18.2593 16.125 20.0909 14.2782 20.0909 12C20.0909 9.72183 18.2593 7.875 16 7.875C13.7407 7.875 11.9091 9.72183 11.9091 12C11.9091 14.2782 13.7407 16.125 16 16.125Z" stroke="#F4F7FB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                  <path class="slash" d="M2 2L30 22" stroke="#F4F7FB" stroke-width="2" stroke-linecap="round" pathLength="100"/>
                </svg>
              </button>
            </div>
          </div>
          <button class="auth-btn" type="submit">Registration</button>
          <p class="auth-error" id="authError"></p>
          <div class="auth-actions center">
            <div class="auth-reg">
              <span>Already have account?</span>
              <a href="login.html">LogIn</a>
            </div>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script src="../js/stars.js"></script>
  <script src="../js/register.js"></script>
</body>
</html>
