<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DepositOne Reset Password</title>
  <link rel="icon" type="image/png" href="../../assets/favicons/favicon.png">
  <link rel="apple-touch-icon" href="../../assets/favicons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/background.css">
  <link rel="stylesheet" href="../../css/auth.css">
</head>
<body>
  <main class="auth">
    <div class="bg">
      <img class="bg-glow bg-glow-sunset" src="../../assets/img/glow-sunset.svg" alt="">
      <img class="bg-glow bg-glow-ambient" src="../../assets/img/glow-ambient.svg" alt="">
      <div class="stars" id="stars"></div>
      <img class="bg-mtn bg-mtn-far" src="../../assets/img/mountains-far.svg" alt="">
      <img class="bg-mtn bg-mtn-mid" src="../../assets/img/mountains-mid.svg" alt="">
      <img class="bg-mtn bg-mtn-near" src="../../assets/img/mountains-near.svg" alt="">
      <img class="bg-mtn bg-mtn-fore" src="../../assets/img/mountains-foreground.svg" alt="">
      <div class="bg-overlay"></div>
    </div>

    <div class="auth-card">
      <a class="auth-logo" href="../../index.html" aria-label="DepositOne — home">
        <div class="auth-badge">WE CARE ABOUT YOU<span class="dot"></span></div>
        <div class="auth-name gradient-text">DEPOSITONE</div>
      </a>

      <div class="auth-body">
        <h1 class="auth-title">Reset Password</h1>
        <form class="auth-form" id="resetForm">
          <div class="auth-fields">
            <input class="auth-field" type="email" name="email" placeholder="Enter Email" autocomplete="email" required>
          </div>
          <button class="auth-btn" type="submit">Reset Password</button>
          <p class="auth-error" id="authError"></p>
          <div class="auth-actions center">
            <a class="auth-forgot" href="login.html">Return to Login</a>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script src="../../js/stars.js"></script>
  <script src="../../js/auth/client.js"></script>
  <script src="../../js/auth/reset-password.js"></script>
</body>
</html>
